<style type="text/css" media="screen">
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;

}
.wrapper {
    position: relative;

.responsive-container iframe {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<div class="responsive-container">
